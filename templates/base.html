<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}actions-recon{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v=20260430">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">actions-recon</a>
            <div class="nav-actions">
                <a href="/settings" class="btn-nav" title="Settings">⚙️</a>
                <button id="theme-toggle" class="btn-theme" type="button" title="Toggle light/dark mode">
                    <span class="icon-light">☀️</span>
                    <span class="icon-dark">🌙</span>
                </button>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>actions-recon &mdash; a GitHub Actions log analysis tool</p>
        <p>Source: <a href="https://github.com/corycalahan/actions-recon" target="_blank" rel="noopener">github.com/corycalahan/actions-recon</a></p>
    </footer>
    <script>
    (function() {
        var toggle = document.getElementById('theme-toggle');
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        toggle.addEventListener('click', function() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    })();
    </script>
</body>
</html>
