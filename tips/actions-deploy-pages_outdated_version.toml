schema_version = 1
id    = "deploy-pages-outdated-version"
name  = "Newer version of actions/deploy-pages available"
emoji = "⬆️"
docs  = "https://github.com/actions/deploy-pages/releases"
created = "2026-02-19"
updated = "2026-02-19"

description = """
The workflow is using an outdated version of actions/deploy-pages.
The latest major version available is v4.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

v4 switched to the Actions Artifacts client, removing the need for the
`actions: read` permission that v3 required. It also updated to Node.js 20.

v4 is only compatible with artifacts uploaded by:
  • actions/upload-pages-artifact@v3 or newer, OR
  • actions/upload-artifact@v4 or newer.

Older major versions may be missing bug fixes, security patches, or
support for newer runner and artifact features.

Consider updating your workflow YAML:
  uses: actions/deploy-pages@v4

See the releases page for the full changelog:
  https://github.com/actions/deploy-pages/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-02-19: v4.0.5
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/deploy-pages"
min_version = "4.0.0"
