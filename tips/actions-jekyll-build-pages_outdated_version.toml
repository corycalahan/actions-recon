schema_version = 1
id    = "jekyll-build-pages-outdated-version"
name  = "Newer version of actions/jekyll-build-pages available"
emoji = "⬆️"
docs  = "https://github.com/actions/jekyll-build-pages/releases"
created = "2026-02-19"
updated = "2026-02-19"

description = """
The workflow is using an outdated version of actions/jekyll-build-pages.
All releases are currently on the v1 major line; the latest patch is v1.0.13.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

Older patch releases may be missing Ruby version updates (v1.0.13 bumped
to Ruby 3.3), pages-gem updates, or bug fixes. Staying on the rolling
major tag (@v1) is recommended so you always receive the latest patch.

Consider updating your workflow YAML:
  uses: actions/jekyll-build-pages@v1

See the releases page for the full changelog:
  https://github.com/actions/jekyll-build-pages/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-02-19: v1.0.13
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# All releases are v1.x; min_version tracks the major line.
# Update min_version if a v2+ is ever released.
action      = "actions/jekyll-build-pages"
min_version = "1.0.0"
