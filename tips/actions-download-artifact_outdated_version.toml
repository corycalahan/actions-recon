schema_version = 1
id    = "download-artifact-outdated-version"
name  = "Newer version of actions/download-artifact available"
emoji = "⬆️"
docs  = "https://github.com/actions/download-artifact/releases"
created = "2026-02-18"
updated = "2026-03-02"

description = """
The workflow is using an outdated version of actions/download-artifact.
The latest major version available is v8.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

Important: actions/download-artifact@v7 runs on Node.js 24 and requires a
minimum runner version of 2.327.1. Older major versions use deprecated
Node.js runtimes and may produce warnings or fail on future runners.

Consider updating your workflow YAML:
  uses: actions/download-artifact@v8

See the releases page for the full changelog:
  https://github.com/actions/download-artifact/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-03-02: v8.0.0
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/download-artifact"
min_version = "8.0.0"
