schema_version = 1
id    = "runner-version-below-ghes-minimum"
name  = "Runner Below GHES Minimum Version"
emoji = "🔄"
docs  = "https://docs.github.com/en/enterprise-server/admin/all-releases#minimum-github-actions-runner-application-versions"
created = "2026-02-18"
updated = "2026-06-22"

description = """
The runner version is below the minimum required for the oldest supported GitHub
Enterprise Server (GHES) release. Self-hosted runners on GHES must meet the
minimum version for their specific GHES release or jobs will fail.

Warning: Self-hosted runners that are not updated to a new release
will stop receiving queued jobs from GitHub Actions.

Minimum required versions by GHES release (as of 2026-02-18):
  GHES 3.21 → 2.331.0,
  GHES 3.20 → 2.330.0,
  GHES 3.19 → 2.328.0,
  GHES 3.18 → 2.324.0,
  GHES 3.17 → 2.322.0,
  GHES 3.16 → 2.321.0 (oldest supported; used as the floor here).

Update the runner application on your self-hosted machine, or enable automatic
updates. See the docs link for the full table.
"""

[check]
type = "version_check"
scope = "all"
# Capture group 1 extracts the version from lines like:
#   Current runner version: '2.323.0'
pattern = "Current runner version: '(\\d+\\.\\d+\\.\\d+)'"
# Floor = minimum required for the oldest currently-supported GHES release (3.16).
# Update this value when GHES releases are added or retired.
# Ref: https://docs.github.com/en/enterprise-server/admin/all-releases#minimum-github-actions-runner-application-versions
min_version = "2.321.0"
