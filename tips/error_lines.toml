schema_version = 1
id    = "error-lines"
name  = "Error Lines Detected"
emoji = "❌"
docs  = "https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions"
created = "2026-02-13"
updated = "2026-02-13"

description = """
The log contains lines annotated with ##[error]. Review each error message
to determine the root cause. Common causes include missing secrets,
permission issues, or failing test commands.
"""

[check]
type = "level_count"
level = "error"
threshold = 0
