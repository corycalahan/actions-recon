schema_version = 1
id    = "delete-package-versions-outdated-version"
name  = "Newer version of actions/delete-package-versions available"
emoji = "⬆️"
docs  = "https://github.com/actions/delete-package-versions/releases"
created = "2026-02-19"
updated = "2026-02-19"

description = """
The workflow is using an outdated version of actions/delete-package-versions.
The latest major version available is v5.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

v5 updated the runtime to Node.js 20 (from Node.js 16) and added support
for container, npm, and NuGet registries via REST APIs (replacing the
deprecated GraphQL approach). The mandatory `package-type` input was also
added in v4+.

Older major versions may be missing bug fixes, security patches, or
support for newer runner features (e.g. Node.js 20 runtime).

Consider updating your workflow YAML:
  uses: actions/delete-package-versions@v5

See the releases page for the full changelog:
  https://github.com/actions/delete-package-versions/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-02-19: v5.0.0
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/delete-package-versions"
min_version = "5.0.0"
