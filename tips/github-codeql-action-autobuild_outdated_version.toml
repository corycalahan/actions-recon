schema_version = 1
id    = "codeql-action-autobuild-outdated-version"
name  = "Newer version of github/codeql-action/autobuild available"
emoji = "⬆️"
docs  = "https://github.com/github/codeql-action/releases"
created = "2026-02-19"
updated = "2026-07-27"

description = """
The workflow is using an outdated version of github/codeql-action/autobuild.
The latest major version available is v4.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

All github/codeql-action sub-actions (init, analyze, autobuild,
upload-sarif) share the same version tag and should be pinned to the
same major version. Using v4 ensures access to the latest CodeQL CLI
bundles, query packs, language support (e.g. Rust, Swift), and security
analysis improvements.

v4 requires a minimum runner version of v2.327.1 for the Node.js 24
runtime.

Consider updating your workflow YAML:
  uses: github/codeql-action/autobuild@v4

See the releases page for the full changelog:
  https://github.com/github/codeql-action/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-07-27: v4.37.3
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the
# "Download immutable action package 'github/codeql-action/autobuild@'" header.
# Works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "github/codeql-action/autobuild"
min_version = "4.0.0"
