schema_version = 1
id    = "stale-outdated-version"
name  = "Newer version of actions/stale available"
emoji = "⬆️"
docs  = "https://github.com/actions/stale/releases"
created = "2026-02-19"
updated = "2026-05-25"

description = """
The workflow is using an outdated version of actions/stale.
The latest major version available is v10.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

v10 updated the Node.js runtime to Node.js 24 (from Node.js 20 in v9).
This requires runner version v2.327.1 or newer. It also added a sort-by
option and the `only-issue-types` filter.

v9 introduced stateful processing: if the action exits early due to
`operations-per-run`, the next run continues from where it left off.
This is important for scheduling workflows when upgrading from v8.

Older major versions may be missing bug fixes, security patches, or
support for newer runner features (e.g. Node.js 24 runtime).

Consider updating your workflow YAML:
  uses: actions/stale@v10

See the releases page for the full changelog:
  https://github.com/actions/stale/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-05-25: v10.3.0
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/stale"
min_version = "10.0.0"
