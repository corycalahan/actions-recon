schema_version = 1
id    = "missing-completion"
name  = "Missing Job Completion"
emoji = "❓"
docs  = "https://docs.github.com/en/actions/monitoring-and-troubleshooting-workflows/troubleshooting-workflows/enabling-debug-logging"
created = "2026-02-13"
updated = "2026-02-17"

description = """
The pattern 'Finishing:' was not found in the log. In debug-enabled workflow logs,
this appears as '##[debug]Finishing:' to signal the runner teardown phase.
If debug logging is disabled, this line is never emitted and the tip will always fire.
For a broader multi-marker check, see the 'Missing Expected Markers' tip.
"""

[check]
type = "missing_pattern"
scope = "workflow"
applies_to = "debug_logs_enabled"
pattern = "Finishing:"
