schema_version = 1
id    = "labeler-outdated-version"
name  = "Newer version of actions/labeler available"
emoji = "⬆️"
docs  = "https://github.com/actions/labeler/releases"
created = "2026-02-19"
updated = "2026-07-13"

description = """
The workflow is using an outdated version of actions/labeler.
The latest major version available is v6.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

v6 updated the Node.js runtime to Node.js 24 (from Node.js 20 in v5).
This requires runner version v2.327.1 or newer.

v5 introduced significant breaking changes to the labeler configuration
file structure (.github/labeler.yml) compared to v4. If upgrading from
v4 or earlier, review the migration guide in the releases notes.

Older major versions may be missing bug fixes, security patches, or
support for newer runner features (e.g. Node.js 24 runtime).

Consider updating your workflow YAML:
  uses: actions/labeler@v6

See the releases page for the full changelog:
  https://github.com/actions/labeler/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-07-13: v6.2.0
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/labeler"
min_version = "6.0.0"
