schema_version = 1
id    = "setup-java-outdated-version"
name  = "Newer version of actions/setup-java available"
emoji = "⬆️"
docs  = "https://github.com/actions/setup-java/releases"
created = "2026-02-18"
updated = "2026-08-31"

description = """
The workflow is using an outdated version of actions/setup-java.
The latest major version available is v6.

Note: The latest version shown here applies to GitHub.com (dotcom).
GitHub Enterprise Server (GHES) bundles its own set of action versions —
the latest may not yet be available on all GHES instances.

Older major versions may lack support for newer JDK distributions,
Gradle/Maven caching improvements, or contain known issues that have
been resolved in later releases.

Consider updating your workflow YAML:
  uses: actions/setup-java@v6

See the releases page for the full changelog:
  https://github.com/actions/setup-java/releases

Update the min_version field in this tip file when a new major version ships:
  Latest as of 2026-08-31: v6.0.0
"""

[check]
type  = "action_version_check"
scope = "workflow"
# Checks the resolved semver from the "Version: X.Y.Z" line after the download
# header, so it works for both tag-pinned and SHA-pinned references.
# Update min_version when the minimum major version advances.
action      = "actions/setup-java"
min_version = "6.0.0"
