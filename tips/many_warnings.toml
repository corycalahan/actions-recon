schema_version = 1
id = "many-warnings"
name = "Excessive Warnings"
emoji = "⚠️"
docs = "https://docs.github.com/en/actions/monitoring-and-troubleshooting-workflows/troubleshooting-workflows/enabling-debug-logging"
description = """
More than 10 warning-level log entries were found.
A high warning count may indicate deprecation notices, misconfigured actions,
or dependency issues that should be addressed before they become errors.
"""
created = "2026-02-17"
updated = "2026-02-17"

[check]
type = "level_count"
mark = "last"
level = "warning"
threshold = 10
